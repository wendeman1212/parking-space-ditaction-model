model:
  path: models/checkpoints/occupancy_mobilenetv3.pt
  architecture: mobilenet_v3_small
  weights_origin: "TorchVision MobileNetV3-Small ImageNet weights, fine-tuned on MetaPKLot/PKLot parking-space crops"
  input_size: 160
  device: cpu
  classes: [EMPTY, OCCUPIED]
  batch_size: 128

training:
  epochs: 12
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 0
  seed: 2026
  class_balance: true
  patience: 4

thresholds:
  occupied_probability: 0.60
  empty_probability: 0.60
  occupied_with_vehicle_probability: 0.35
  detector_overlap_occupied: 0.30
  detector_overlap_min: 0.08
  ambiguous_overlap_ratio: 0.75
  min_detection_confidence: 0.30
  min_visibility_score: 0.45
  min_brightness: 35.0
  min_laplacian_variance: 25.0

temporal:
  occupied_confirm_frames: 2
  empty_confirm_frames: 2
  vacated_confirm_seconds: 3.0
  entry_confirm_seconds: 0.5
  history_size: 30
