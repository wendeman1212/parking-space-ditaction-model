model:
  path: yolo11n.pt
  architecture: yolo11n
  weights_origin: "Ultralytics YOLO11n, pretrained on COCO 2017 (AGPL-3.0)"
  task: detect
  imgsz: 640
  device: cpu
  half: false
  confidence: 0.10
  iou: 0.50
  max_detections: 100
  class_agnostic_nms: true

classes:
  car: car
  motorcycle: motorcycle
  bus: bus
  truck: truck
  van: car
  pickup truck: truck
  three-wheeler: car

supported_output_classes: [car, motorcycle, bus, truck]

training:
  epochs: 20
  batch_size: 16
  imgsz: 640
  patience: 8
  seed: 2026

tracking:
  tracker: bytetrack.yaml
  persist: true
  track_high_thresh: 0.30
  track_low_thresh: 0.10
  new_track_thresh: 0.35
  track_buffer: 60
  match_thresh: 0.80
  min_box_area: 120
